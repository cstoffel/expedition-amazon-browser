<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Expedition Amazon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:white}main{min-height:100svh;display:grid;place-items:center;padding:10px}.display{position:relative;width:min(96vw,calc((100svh - 20px)*4/3),960px);aspect-ratio:4/3;background:#000;box-shadow:0 0 0 1px #161616}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:text}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style></head><body><main><form id="access-form" aria-label="Password entry"><div class="display"><canvas id="access-screen" width="280" height="192" aria-hidden="true"></canvas><label for="access-password" class="sr-only">PASSWORD?</label><input id="access-password" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required autofocus maxlength="120" aria-describedby="access-message"></div><button class="sr-only" type="submit">Enter</button><p id="access-message" class="sr-only" role="status" aria-live="polite"></p></form><noscript>JavaScript is required.</noscript></main>
<script>
// Standalone gateway UI: inline glyphs only, no game scripts or asset requests.
'use strict';
const expected='57e67631e7daac208d9a5d17b2de135828b92efcf7616c237f56a69b5d459187';
const salt='01c25537246a57eb85b00b8135dedd0b',iterations=600000;
const font=Uint8Array.from(atob('ABwiKi4sIB4ACBQiIj4iIgA8IiI8IiI8ABwiICAgIhwAPCIiIiIiPAA+ICA8ICA+AD4gIDwgICAAHiAgICYiHgAiIiI+IiIiABwICAgICBwAAgICAgIiHAAiJCgwKCQiACAgICAgID4AIjYqKiIiIgAiIjIqJiIiABwiIiIiIhwAPCIiPCAgIAAcIiIiKiQaADwiIjwoJCIAHCIgHAIiHAA+CAgICAgIACIiIiIiIhwAIiIiIiIUCAAiIiIqKjYiACIiFAgUIiIAIiIUCAgICAA+AgQIECA+AD4wMDAwMD4AACAQCAQCAAA+BgYGBgY+AAAACBQiAAAAAAAAAAAAPgAAAAAAAAAAAAgICAgIAAgAFBQUAAAAAAAUFD4UPhQUAAgeKBwKPAgAMDIECBAmBgAQKCgQKiQaAAgICAAAAAAACBAgICAQCAAIBAICAgQIAAgqHAgcKggAAAgIPggIAAAAAAAACAgQAAAAAD4AAAAAAAAAAAAACAAAAgQIECAAABwiJioyIhwACBgICAgIHAAcIgIMECA+AD4CBAwCIhwABAwUJD4EBAA+IDwCAiIcAA4QIDwiIhwAPgIECBAQEAAcIiIcIiIcABwiIh4CBDgAAAAIAAgAAAAAAAgACAgQAAQIECAQCAQAAAA+AD4AAAAQCAQCBAgQABwiBAgIAAg='),c=>c.charCodeAt(0));
const input=document.querySelector('#access-password'),form=document.querySelector('#access-form'),message=document.querySelector('#access-message'),canvas=document.querySelector('#access-screen'),context=canvas.getContext('2d');
let busy=false,last='';
function draw(){
 const phase=Math.floor(performance.now()/500)%2===0,visible=input.value.slice(-38),signature=visible+'|'+phase+'|'+message.textContent;
 if(signature!==last){
  const pixels=new Uint8ClampedArray(280*192*4);for(let i=3;i<pixels.length;i+=4)pixels[i]=255;
  function text(row,col,value){for(const [index,char]of [...value.toUpperCase()].entries()){const code=char.charCodeAt(0)&63;for(let y=0;y<8;y++)for(let x=0;x<7;x++)if(font[code*8+y]&(1<<(6-x))){const at=((row*8+y)*280+Math.floor((col+index)*7)+x)*4;pixels[at]=pixels[at+1]=pixels[at+2]=255;}}}
  text(9.5,15.5,'PASSWORD?');const column=(40-visible.length-1)/2;text(11.5,column,visible);
  if(phase)for(let y=0;y<8;y++)for(let x=0;x<7;x++){const at=((11.5*8+y)*280+Math.floor((column+visible.length)*7)+x)*4;pixels[at]=pixels[at+1]=pixels[at+2]=255;}
  if(message.textContent)text(15,Math.max(0,Math.floor((40-message.textContent.length)/2)),message.textContent.slice(0,40));
  context.putImageData(new ImageData(pixels,280,192),0,0);last=signature;
 }
 requestAnimationFrame(draw);
}
draw();
form.addEventListener('submit',async event=>{
 event.preventDefault();if(busy)return;busy=true;message.textContent='';
 try{
  if(!globalThis.crypto?.subtle)throw Error('HTTPS OR LOCALHOST REQUIRED');
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(salt.match(/../g),x=>parseInt(x,16)),iterations},key,256);
  input.value='';const hash=Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('');
  let difference=0;for(let i=0;i<expected.length;i++)difference|=hash.charCodeAt(i)^expected.charCodeAt(i);
  if(difference){message.textContent='?INCORRECT PASSWORD';input.focus();}
  else{
   sessionStorage.setItem('expedition-amazon.unlocked.v1','1');
   location.assign('exp_amzn.html'+location.search);
  }
 }catch(error){input.value='';message.textContent=error.message;}
 finally{busy=false;}
});
</script></body></html>
